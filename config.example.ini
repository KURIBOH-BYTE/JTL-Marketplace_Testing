; Zugangsdaten für die JTL-Versuche auf dem DEV-Server.
; Kopieren nach config.ini und ausfüllen. config.ini ist per .gitignore
; ausgenommen und wandert nie ins Repository.
;
; NUR DEV-SYSTEM EINTRAGEN. Diese Skripte schreiben in die Datenbank.

[jtl]
; Datenbankserver wie im Ameise-Dialog, z.B. (local)\JTLWAWI
server = (local)\JTLWAWI
database = eazybusiness
user = sa
password = CHANGEME
; Wawi-Profil zum SQL Server (Ameise-Pflichtparameter -w).
; Leer lassen, falls nicht gesetzt.
wawiprofile =

[ameise]
; Standardpfad einer 64-Bit-Installation; bei 32 Bit "Program Files (x86)".
exe = C:\Program Files\JTL-Software\JTL-wawi-ameise.exe
; Vorlagen-IDs. Werden in der Ameise-Oberfläche beim Laden/Speichern
; angezeigt. Import beginnt mit IMP, Export mit EXP.
; Ohne passende Vorlage geht nichts - die Vorlage legt fest, welche Spalte
; in welches JTL-Feld geht bzw. welche Spalten ein Export enthält.
;
; Auftragsimport. Nötige Zuordnung zeigt:
;   python tools/jtl_import.py --mapping
import_orders =
; Exporte
export_articles =
export_orders =
export_stock =

[paths]
; Ordner "jtl-integration" aus dem Repository JTL-Marketplace-Integration.
; Leer lassen, wenn beide Repositories nebeneinander liegen – dann wird er
; automatisch gefunden. Alternativ die Umgebungsvariable JTL_MIDDLEWARE
; setzen oder --middleware übergeben.
middleware =
